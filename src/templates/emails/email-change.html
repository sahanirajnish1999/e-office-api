<div style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden;">
  <div style="background-color: #1a365d; color: #ffffff; padding: 20px; text-align: center;">
    <h2 style="margin: 0;">Email Change Request {{status}}</h2>
  </div>
  <div style="padding: 24px;">
    <p>{{message}}</p>
    <p style="font-size: 12px; color: #a0aec0;">Updated on: {{current-date}} | Reviewed by: {{sender-user-name}}</p>
  </div>
</div>
